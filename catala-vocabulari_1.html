<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulari català · 加泰罗尼亚语词汇</title>
<style>
  :root{
    --paper:#FBFAF6;
    --card:#FFFFFF;
    --ink:#16171A;
    --ink-soft:#6B6F76;
    --grid:#CFD5DA;
    --grid-soft:#E4E8EB;
    --red:#C8392B;
    --green:#2F7D52;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --han:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;padding-bottom:96px;
  }
  .wrap{max-width:1220px;margin:0 auto;padding:0 24px}

  /* capçalera */
  header{padding:36px 0 0}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:10px 0 0}
  .title h1{font-size:clamp(30px,5vw,44px);line-height:1;margin:0;font-weight:700;letter-spacing:-.03em}
  .title .zh{font-family:var(--han);font-size:clamp(22px,4vw,32px);color:var(--red);font-weight:600}

  nav{margin-top:26px;border-bottom:1px solid var(--grid);display:flex;gap:2px}
  .tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
    font-family:var(--sans);font-size:14px;color:var(--ink-soft);padding:10px 14px;cursor:pointer;margin-bottom:-1px}
  .tab .zh{font-family:var(--han);margin-left:7px;font-size:13px}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);font-weight:600}
  .tab:disabled{opacity:.35;cursor:not-allowed}

  /* filtre de temes */
  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:18px 0 22px}
  .chip{
    appearance:none;cursor:pointer;border:1px solid var(--grid-soft);background:var(--card);
    border-radius:100px;padding:7px 14px;font-family:var(--sans);font-size:13px;color:var(--ink-soft);
    display:flex;align-items:center;gap:7px;transition:.15s;
  }
  .chip .zh{font-family:var(--han);font-size:12px;opacity:.8}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
  .chip:hover{border-color:var(--ink-soft);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .chip[aria-pressed="true"] .dot{opacity:1}
  .spacer{flex:1;min-width:12px}
  #newSet{
    appearance:none;cursor:pointer;border:1px solid var(--ink);background:var(--card);color:var(--ink);
    border-radius:2px;padding:9px 15px;font-family:var(--sans);font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:8px;transition:.15s;
  }
  #newSet .zh{font-family:var(--han);font-weight:400;font-size:12px;opacity:.7}
  #newSet:hover{background:var(--ink);color:#fff}
  #newSet svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}

  /* graella */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--grid-soft);border:1px solid var(--grid-soft)}
  @media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:540px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--card);padding:16px 16px 14px;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    opacity:0;transform:translateY(6px);animation:in .4s ease forwards;
  }
  @keyframes in{to{opacity:1;transform:none}}
  .gen{position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:10px;color:var(--grid);letter-spacing:.06em}
  .theme{position:absolute;top:9px;left:12px;font-family:var(--han);font-size:11px;letter-spacing:.06em}
  .plate{width:86px;height:86px;border-radius:16px;display:grid;place-items:center;margin-top:6px}
  .plate span{font-family:var(--emoji);font-size:46px;line-height:1}
  .hanzi{font-family:var(--han);font-size:27px;font-weight:600;line-height:1.1;letter-spacing:.04em;text-align:center}
  .pinyin{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.06em;margin-top:-5px}

  .answer{display:flex;align-items:center;gap:6px;width:100%;margin-top:4px}
  .box{
    position:relative;flex:1;height:48px;border:1px solid var(--grid);background-color:transparent;
    background-image:
      repeating-linear-gradient(to right,var(--grid) 0 5px,transparent 5px 11px),
      repeating-linear-gradient(to bottom,var(--grid) 0 5px,transparent 5px 11px);
    background-size:100% 1px,1px 100%;background-position:center,center;background-repeat:no-repeat;
    transition:border-color .18s,background-color .18s;
  }
  .box input{width:100%;height:100%;border:0;background:transparent;font-family:var(--sans);
    font-size:18px;text-align:center;color:var(--ink);letter-spacing:.02em}
  .box input:focus{outline:none}
  .box:focus-within{border-color:var(--red)}
  .box.ok{border-color:var(--green);background-color:rgba(47,125,82,.06)}
  .box.no{border-color:var(--red);background-color:rgba(200,57,43,.06)}
  .box input.model{color:var(--grid);letter-spacing:.14em}

  .mini{
    appearance:none;border:1px solid var(--grid-soft);background:var(--card);border-radius:2px;
    width:32px;height:32px;cursor:pointer;color:var(--ink-soft);display:grid;place-items:center;padding:0;transition:.15s;
  }
  .mini svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .mini:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
  .mini:disabled{opacity:.28;cursor:not-allowed}
  .mini.check.ok{border-color:var(--green);color:var(--green)}
  .mini.check.no{border-color:var(--red);color:var(--red)}

  .sol{
    min-height:17px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);
    letter-spacing:.03em;opacity:0;transition:opacity .2s;text-align:center;
  }
  .sol.on{opacity:1}
  .sol b{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);letter-spacing:0}

  /* barra inferior */
  footer{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--grid);z-index:5}
  .bar{max-width:1220px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .score{font-family:var(--mono);font-size:15px;letter-spacing:.04em;margin-right:auto}
  .score b{font-size:22px;font-weight:500}
  .score .lab{color:var(--ink-soft);font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:block}
  button.act{appearance:none;border-radius:2px;cursor:pointer;padding:11px 18px;font-family:var(--sans);
    font-size:14px;font-weight:600;line-height:1.2;display:flex;align-items:baseline;gap:8px;transition:.15s}
  button.act .zh{font-family:var(--han);font-size:12px;font-weight:400;opacity:.75}
  .primary{background:var(--red);color:#fff;border:1px solid var(--red)}
  .primary:hover{background:#A82D21;border-color:#A82D21}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--grid)}
  .ghost:hover{border-color:var(--ink)}
  .link{background:none;border:0;color:var(--ink-soft);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .link:hover{color:var(--ink)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transform:none}*{transition:none!important}}
</style>
</head>

<div class="wrap">

</div>

    M('pluja','la','f','🌧️','雨','yǔ'),
    M('tempesta','la','f','⛈️','暴风雨','bào fēng yǔ'),
    M('llamp','el','m','⚡','闪电','shǎn diàn'),
    M('neu','la','f','❄️','雪','xuě'),
    M('gel','el','m','🧊','冰','bīng'),
    M('vent','el','m','💨','风','fēng'),
    M('boira','la','f','🌫️','雾','wù'),
    M('arc de Sant Martí','l’','m','🌈','彩虹','cǎi hóng'),
    M('arbre','l’','m','🌳','树','shù'),
    M('bosc','el','m','🌲','森林','sēn lín'),

    M('rosa','la','f','🌹','玫瑰','méi gui'),
    M('tulipa','la','f','🌷','郁金香','yù jīn xiāng'),
    M('gira-sol','el','m','🌻','向日葵','xiàng rì kuí'),
    M('cactus','el','m','🌵','仙人掌','xiān rén zhǎng'),

    M('volcà','el','m','🌋','火山','huǒ shān'),
    M('desert','el','m','🏜️','沙漠','shā mò'),
    M('mar','el','m','🌊','海','hǎi'),
    M('platja','la','f','🏖️','海滩','hǎi tān'),
    M('illa','l’','f','🏝️','岛','dǎo'),
    M('foc','el','m','🔥','火','huǒ'),
    M('Terra','la','f','🌍','地球','dì qiú')
  ]}
];

const ROUND = 16;
const byId = Object.fromEntries(THEMES.map(t => [t.id, t]));
let filter = 'tots';
let last = new Set();

/* ---------- filtres ---------- */
const filters = document.getElementById('filters');
function mkChip(id, ca, zh, color){
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.id = id;
  b.setAttribute('aria-pressed', String(id === filter));
  b.innerHTML = (color ? `<span class="dot" style="color:${color}"></span>` : '') +
                `${ca}<span class="zh">${zh}</span>`;
  b.onclick = () => {
    filter = id;
    filters.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.id === id)));
    last = new Set();
    newRound();
  };
  return b;
}
filters.appendChild(mkChip('tots','Tots','全部',''));
THEMES.forEach(t => filters.appendChild(mkChip(t.id, t.ca, t.zh, t.color)));
const sp = document.createElement('span'); sp.className = 'spacer'; filters.appendChild(sp);
const nb = document.createElement('button');
nb.id = 'newSet';
nb.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 5v6h-6"/></svg>16 paraules noves<span class="zh">换一批</span>`;
nb.onclick = () => newRound();
filters.appendChild(nb);

/* ---------- ronda ---------- */
const grid = document.getElementById('grid');

function pool(){
  return filter === 'tots'
    ? THEMES.flatMap(t => t.mots.map(m => Object.assign({}, m, {t})))
    : byId[filter].mots.map(m => Object.assign({}, m, {t: byId[filter]}));
}

function pick(){
  const all = pool();
  const key = m => m.t.id + '/' + m.w;
  const fresh = all.filter(m => !last.has(key(m)));
  const src = fresh.length >= ROUND ? fresh : all;
  const s = src.slice();
  for(let i = s.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const tmp = s[i]; s[i] = s[j]; s[j] = tmp; }
  const out = s.slice(0, ROUND);
  last = new Set(out.map(key));
  return out;
}

const full = m => m.a.endsWith('’') ? m.a + m.w : m.a + ' ' + m.w;

function newRound(){
  grid.innerHTML = '';
  pick().forEach((m, i) => {
    const c = document.createElement('article');
    c.className = 'card';
    c.style.animationDelay = (i * 20) + 'ms';
    c.dataset.w = m.w;
    c.dataset.full = full(m);
    c.innerHTML =
      (filter === 'tots' ? `<span class="theme" style="color:${m.t.color}">${m.t.zh}</span>` : '') +
      `<span class="gen">n. ${m.g}</span>
      <div class="plate" style="background:${m.t.color}14"><span>${m.e}</span></div>
      <div class="hanzi">${m.zh}</div>
      <div class="pinyin">${m.py}</div>
      <div class="answer">
        <div class="box">
          <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                 aria-label="Escriu en català: ${m.zh} ${m.py}">
        </div>
        <button class="mini check" title="Corregeix aquesta 检查这个">
          <svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
        </button>
        <button class="mini say" disabled title="Escolta 听">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>
        </button>
      </div>
      <div class="sol"><b></b> · n. ${m.g}</div>`;
    grid.appendChild(c);
  });
  bind();
  document.getElementById('hits').textContent = '0';
}

/* ---------- lògica ---------- */
const clean = s => s.toLowerCase().trim()
  .replace(/[\u2019']/g,' ')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[·.,!?-]/g,' ')
  .replace(/\s+/g,' ')
  .replace(/^(el|la|els|les|un|una|uns|unes|l)\s+/,'')
  .trim();

const isRight = (v, w) => v.trim() !== '' && clean(v) === clean(w);

function paint(card, state){
  const box = card.querySelector('.box'), btn = card.querySelector('.check');
  box.classList.remove('ok','no'); btn.classList.remove('ok','no');
  if(state){ box.classList.add(state); btn.classList.add(state); }
}
function solve(card, on){
  const sol = card.querySelector('.sol');
  sol.querySelector('b').textContent = card.dataset.full;
  sol.classList.toggle('on', on);
  card.querySelector('.say').disabled = !on;
}
function score(){
  const n = Array.from(grid.querySelectorAll('.card')).filter(c => {
    const i = c.querySelector('input');
    return !i.classList.contains('model') && isRight(i.value, c.dataset.w);
  }).length;
  document.getElementById('hits').textContent = n;
}
function checkOne(card){
  const inp = card.querySelector('input');
  if(inp.value.trim() === ''){ inp.focus(); return false; }
  inp.classList.remove('model');
  const ok = isRight(inp.value, card.dataset.w);
  paint(card, ok ? 'ok' : 'no');
  if(ok) solve(card, true);
  score();
  return ok;
}

function bind(){
  const cards = Array.from(grid.querySelectorAll('.card'));
  const inputs = cards.map(c => c.querySelector('input'));
  cards.forEach((c, i) => {
    const inp = inputs[i];
    c.querySelector('.check').onclick = () => checkOne(c);
    c.querySelector('.say').onclick = () => {
      if(!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(c.dataset.full.replace('’', "'"));
      u.lang = 'ca-ES'; u.rate = .8;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    };
    inp.addEventListener('input', () => { inp.classList.remove('model'); paint(c, null); });
    inp.addEventListener('keydown', e => {
      if(e.key !== 'Enter') return;
      e.preventDefault();
      checkOne(c);
      const next = inputs.slice(i + 1).find(x => x.value.trim() === '') || inputs[(i + 1) % inputs.length];
      next.focus();
    });
  });
}

document.getElementById('check').onclick = () => {
  grid.querySelectorAll('.card').forEach(c => {
    const inp = c.querySelector('input');
    inp.classList.remove('model');
    if(inp.value.trim() === ''){ paint(c, null); return; }
    const ok = isRight(inp.value, c.dataset.w);
    paint(c, ok ? 'ok' : 'no');
    if(ok) solve(c, true);
  });
  score();
};

document.getElementById('showAll').onclick = () => {
  grid.querySelectorAll('.card').forEach(c => {
    const inp = c.querySelector('input');
    const ok = isRight(inp.value, c.dataset.w);
    if(ok){ paint(c, 'ok'); }
    else { inp.value = c.dataset.w; inp.classList.add('model'); paint(c, null); }
    solve(c, true);
  });
  score();
};

document.getElementById('reset').onclick = () => {
  grid.querySelectorAll('.card').forEach(c => {
    const inp = c.querySelector('input');
    inp.value = ''; inp.classList.remove('model');
    paint(c, null); solve(c, false);
  });
  document.getElementById('hits').textContent = '0';
  grid.querySelector('input').focus();
};

newRound();
</script>
