<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Del xinès al català — 25 frases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E2E9E1;
  --paper:#FCFBF8;
  --ink:#1C2A27;
  --ink-soft:#5C6D68;
  --cinnabar:#C2452F;
  --line:rgba(28,42,39,.16);
  --sel:rgba(194,69,47,.16);
  --sans:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --zh:"Noto Serif SC","Songti SC","STSong",SimSun,serif;
  --py:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121918; --paper:#1C2624; --ink:#E7EBE4; --ink-soft:#95A49E;
    --cinnabar:#E4735A; --line:rgba(231,235,228,.18); --sel:rgba(228,115,90,.22);
  }
}
:root[data-theme="dark"]{
  --bg:#121918; --paper:#1C2624; --ink:#E7EBE4; --ink-soft:#95A49E;
  --cinnabar:#E4735A; --line:rgba(231,235,228,.18); --sel:rgba(228,115,90,.22);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--sel)}
.wrap{max-width:680px; margin:0 auto; padding:28px 20px 56px}

/* ---------- capçalera ---------- */
header{padding-bottom:18px; border-bottom:1px solid var(--line)}
h1{font-size:20px; font-weight:600; letter-spacing:-.01em; margin:0}
.sub{margin:2px 0 0; font-size:14px; color:var(--ink-soft)}
.sub b{font-family:var(--py); font-weight:400}

.ticks{display:flex; flex-wrap:wrap; gap:4px; margin-top:16px}
.tick{
  flex:1 1 24px; min-width:24px; max-width:34px; height:24px;
  padding:0; border:1px solid var(--line); border-radius:1px;
  background:transparent; cursor:pointer; color:var(--ink-soft);
  font-family:var(--sans); font-size:11.5px; font-weight:500; line-height:1;
  font-variant-numeric:tabular-nums;
  display:grid; place-items:center;
  transition:background .12s, border-color .12s, color .12s;
}
.tick:hover{border-color:var(--ink); color:var(--ink)}
.tick[data-status="seen"]{background:var(--ink-soft); border-color:transparent; color:var(--paper)}
.tick[aria-current="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}

/* ---------- frase ---------- */
.prompt{
  position:relative; background:var(--paper); margin-top:26px;
  padding:22px 22px 26px; border:1px solid var(--line);
}
.prompt::before,.prompt::after{
  content:""; position:absolute; width:11px; height:11px; pointer-events:none;
}
.prompt::before{top:-1px; left:-1px; border-top:2px solid var(--cinnabar); border-left:2px solid var(--cinnabar)}
.prompt::after{bottom:-1px; right:-1px; border-bottom:2px solid var(--cinnabar); border-right:2px solid var(--cinnabar)}

.prompt-top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.counter{font-size:13.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; letter-spacing:.02em; margin:0}
.audio{display:flex; gap:8px; flex:none}
.abtn{
  width:44px; height:44px; border-radius:50%; cursor:pointer;
  border:1.5px solid var(--cinnabar); background:transparent; color:var(--cinnabar);
  display:grid; place-items:center; font-family:var(--py); font-size:13px; font-weight:500;
  transition:background .14s, color .14s;
}
.abtn:hover{background:var(--cinnabar); color:var(--paper)}
.abtn svg{width:18px; height:18px; fill:currentColor}
.abtn.on{background:var(--cinnabar); color:var(--paper)}

.zh{
  font-family:var(--zh); font-weight:600; line-height:1.56;
  font-size:clamp(21px,4.9vw,27px); margin:14px 0 0; letter-spacing:.01em;
}
.py{
  font-family:var(--py); font-size:15px; line-height:1.55; color:var(--ink-soft);
  margin:12px 0 0; letter-spacing:.01em;
}
.novoice{margin:14px 0 0; font-size:13.5px; color:var(--cinnabar)}

/* ---------- resposta de l'alumne ---------- */
.work{margin-top:24px}
.work label{display:block; font-size:14px; color:var(--ink-soft); margin-bottom:7px}
textarea{
  width:100%; min-height:124px; resize:vertical; padding:14px 15px;
  font-family:var(--sans); font-size:18px; line-height:1.5; color:var(--ink);
  background:var(--paper); border:1px solid var(--line); border-radius:2px;
}
textarea::placeholder{color:var(--ink-soft); opacity:.6}
textarea:focus{outline:2px solid var(--ink); outline-offset:1px; border-color:transparent}

.row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
button.b{
  font-family:var(--sans); font-size:15px; font-weight:500; cursor:pointer;
  padding:10px 15px; border-radius:2px; border:1px solid var(--ink);
  background:transparent; color:var(--ink); transition:background .14s,color .14s;
}
button.b:hover{background:var(--ink); color:var(--paper)}
button.b.fill{background:var(--ink); color:var(--paper)}
button.b.fill:hover{opacity:.84}
button.b.quiet{border-color:var(--line); color:var(--ink-soft)}
button.b.quiet:hover{background:transparent; border-color:var(--ink); color:var(--ink)}
button.b small{font-family:var(--py); font-weight:400; font-size:13px; opacity:.72; margin-left:5px}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* ---------- solució ---------- */
.answer{display:none; margin-top:14px; background:var(--paper); border:1px solid var(--line); padding:18px 20px 20px}
.answer.show{display:block; animation:in .26s ease both}
@keyframes in{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.answer.show{animation:none}}
.answer h2{margin:0 0 8px; font-size:13.5px; font-weight:500; color:var(--ink-soft)}
.answer p.ca{margin:0; font-size:clamp(19px,3.8vw,22px); font-weight:500; line-height:1.42; letter-spacing:-.005em}
.answer p.alt{margin:10px 0 0; font-size:16px; line-height:1.45; color:var(--ink-soft)}
.answer p.note{margin:15px 0 0; padding-top:14px; border-top:1px solid var(--line); font-size:15px; color:var(--ink-soft); line-height:1.6}
.answer p.note span{font-family:var(--py)}
.answer p.note b{color:var(--ink); font-weight:500}

/* ---------- peu ---------- */
.pager{display:flex; justify-content:space-between; gap:8px; margin-top:26px; padding-top:18px; border-top:1px solid var(--line)}
footer{margin-top:22px; font-size:14px; color:var(--ink-soft); display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
footer .stat b{font-weight:500; color:var(--ink); font-variant-numeric:tabular-nums}
.keys{margin-top:14px; font-size:13px; color:var(--ink-soft); opacity:.85}
kbd{font-family:var(--sans); font-size:12px; border:1px solid var(--line); border-radius:2px; padding:1px 5px}

@media (max-width:480px){
  .wrap{padding:22px 16px 48px}
  .prompt{padding:18px 16px 22px}
  .row button.b, .pager button.b{flex:1 1 auto}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Del xinès al català</h1>
    <p class="sub">25 frases per traduir · combinació de temps verbals · <b>中译加练习</b></p>
    <nav class="ticks" id="ticks" aria-label="Frases"></nav>
  </header>

  <main>
    <section class="prompt">
      <div class="prompt-top">
        <p class="counter" id="counter">01 / 25</p>
        <div class="audio">
          <button class="abtn" id="play" title="Escolta la frase" aria-label="Escolta la frase">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3.2L12 4.6v14.8L7.2 15H4V9z"/><path d="M15.5 8.2c1.3 1 2 2.3 2 3.8s-.7 2.8-2 3.8v-1.9c.6-.6.9-1.2.9-1.9s-.3-1.3-.9-1.9V8.2z"/><path d="M18.6 5.4c2.2 1.6 3.4 3.9 3.4 6.6s-1.2 5-3.4 6.6v-2c1.5-1.3 2.3-2.9 2.3-4.6s-.8-3.3-2.3-4.6v-2z"/></svg>
          </button>
          <button class="abtn" id="playslow" title="Escolta-la a poc a poc" aria-label="Escolta-la a poc a poc">慢</button>
        </div>
      </div>
      <p class="zh" id="zh" lang="zh-CN"></p>
      <p class="py" id="py"></p>
      <p class="novoice" id="novoice" hidden>Aquest navegador no té cap veu xinesa instal·lada, així que la frase no es pot llegir en veu alta.</p>
    </section>

    <section class="work">
      <label for="answer-input">La teva traducció al català</label>
      <textarea id="answer-input" placeholder="Escriu-la aquí…" spellcheck="false" autocomplete="off"></textarea>
      <div class="row">
        <button class="b fill" id="reveal">Mostra la resposta<small>显示答案</small></button>
        <button class="b quiet" id="clear">Esborra i torna-hi</button>
      </div>
    </section>

    <section class="answer" id="answer" aria-live="polite">
      <h2>Una traducció possible</h2>
      <p class="ca" id="ca"></p>
      <p class="alt" id="alt"></p>
      <p class="note" id="note"></p>
    </section>

    <nav class="pager">
      <button class="b quiet" id="prev">← Anterior</button>
      <button class="b" id="next">Següent →</button>
    </nav>
  </main>

  <footer>
    <span class="stat">Practicades <b id="s-seen">0</b> / 25</span>
    <button class="b quiet" id="restart" style="font-size:14px; padding:6px 11px">Comença de nou</button>
  </footer>
  <p class="keys"><kbd>Ctrl</kbd> + <kbd>↵</kbd> mostra la resposta · <kbd>Alt</kbd> + <kbd>←</kbd> <kbd>→</kbd> canvia de frase</p>

</div>

<script>
const DATA = [
/* --- present i hàbits --- */
{zh:"每个月一号我付房租，然后存一点钱，以防有意外的开销。",

 ca:"Cada dia u de mes pago el lloguer i estalvio una mica per si hi ha imprevistos.",

 note:"Dues accions que es repeteixen cada mes: <b>present d'indicatiu</b> a totes dues. Recorda que <b>pagar</b> fa <b>paguem</b> amb gu davant de e."},

{zh:"因为我住的地方离车站很近，所以我每天都走路去上班。",

{zh:"我小的时候，每年夏天我们都去我奶奶的村子，在那里待一个月。",

 note:"Costums del passat que es repetien: <b>imperfet</b> a tots els verbs (era, anàvem, quedàvem). El pronom <b>hi</b> substitueix «al poble» i evita repetir-lo. <span>「那里」用 hi 代替。</span>"},

/* --- el relat en passat --- */
{zh:"我正在准备演示的时候，我的同事打电话确认了跟客户的会议。",

const KEY = "catala-xines-v2";
let state = { answers:{}, seen:{}, idx:0 };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && typeof s === "object"){
        state.answers = s.answers || {};
        state.seen = s.seen || {};
        state.idx = Number.isInteger(s.idx) ? Math.min(Math.max(s.idx,0), DATA.length-1) : 0;
      }
    }
  }catch(e){ /* sense memòria: continuem igual */ }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const $ = id => document.getElementById(id);
const els = {
  ticks:$("ticks"), counter:$("counter"), zh:$("zh"), py:$("py"), novoice:$("novoice"),
  input:$("answer-input"), reveal:$("reveal"), clear:$("clear"),
  answer:$("answer"), ca:$("ca"), alt:$("alt"), note:$("note"),
  prev:$("prev"), next:$("next"), sSeen:$("s-seen")
};

DATA.forEach((_,i)=>{
  const b = document.createElement("button");
  b.className = "tick"; b.type = "button";
  b.setAttribute("aria-label","Frase "+(i+1));
  b.textContent = String(i+1);
  b.addEventListener("click", ()=> go(i));
  els.ticks.appendChild(b);
});

/* ---- veu ---- */
let voice = null, checked = false;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  checked = true;
  voice = vs.find(v=>/^zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
  els.novoice.hidden = !!voice;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.addEventListener("voiceschanged", pickVoice);
  setTimeout(pickVoice, 600);
}else{
  els.novoice.hidden = false;
}
function speak(rate, btn){
  if(!("speechSynthesis" in window)){ els.novoice.hidden = false; return; }
  if(!checked) pickVoice();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(DATA[state.idx].zh);
  u.lang = "zh-CN"; u.rate = rate;
  if(voice) u.voice = voice;
  u.onstart = ()=> btn.classList.add("on");
  u.onend = u.onerror = ()=> btn.classList.remove("on");
  speechSynthesis.speak(u);
}
$("play").addEventListener("click", e => speak(1, e.currentTarget));
$("playslow").addEventListener("click", e => speak(.6, e.currentTarget));

/* ---- pintar ---- */
const pad = n => String(n).padStart(2,"0");

function render(){
  const i = state.idx, d = DATA[i];
  els.zh.textContent = d.zh;
  els.py.textContent = d.py;
  els.counter.textContent = pad(i+1) + " / " + pad(DATA.length);

  els.input.value = state.answers[i] || "";
  els.answer.classList.remove("show");
  els.reveal.innerHTML = 'Mostra la resposta<small>显示答案</small>';

  els.ca.textContent = d.ca;
  els.alt.textContent = d.alt.length ? "També pot ser: " + d.alt.join(" / ") : "";
  els.alt.style.display = d.alt.length ? "" : "none";
  els.note.innerHTML = d.note;

  els.prev.disabled = i === 0;
  els.prev.style.opacity = i === 0 ? .35 : 1;
  els.next.disabled = i === DATA.length-1;
  els.next.style.opacity = i === DATA.length-1 ? .35 : 1;

  [...els.ticks.children].forEach((b,k)=>{
    if(state.seen[k]) b.dataset.status = "seen"; else b.removeAttribute("data-status");
    b.setAttribute("aria-current", k === i ? "true" : "false");
  });
  els.sSeen.textContent = Object.keys(state.seen).length;
}

function go(n){
  if(n < 0 || n >= DATA.length) return;
  state.idx = n; save(); render();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---- accions ---- */
els.input.addEventListener("input", ()=>{ state.answers[state.idx] = els.input.value; save(); });

els.reveal.addEventListener("click", ()=>{
  const open = els.answer.classList.toggle("show");
  els.reveal.innerHTML = open
    ? 'Amaga la resposta<small>隐藏</small>'
    : 'Mostra la resposta<small>显示答案</small>';
  if(open && !state.seen[state.idx]){
    state.seen[state.idx] = 1; save();
    els.ticks.children[state.idx].dataset.status = "seen";
    els.sSeen.textContent = Object.keys(state.seen).length;
  }
});

els.clear.addEventListener("click", ()=>{
  delete state.answers[state.idx];
  els.input.value = "";
  els.answer.classList.remove("show");
  els.reveal.innerHTML = 'Mostra la resposta<small>显示答案</small>';
  save(); els.input.focus();
});

els.prev.addEventListener("click", ()=> go(state.idx-1));
els.next.addEventListener("click", ()=> go(state.idx+1));

$("restart").addEventListener("click", ()=>{
  if(!confirm("Vols esborrar totes les respostes i començar de nou?")) return;
  state = { answers:{}, seen:{}, idx:0 };
  save(); render();
  window.scrollTo({top:0, behavior:"smooth"});
});

document.addEventListener("keydown", e=>{
  if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); els.reveal.click(); }
  if(e.altKey && e.key === "ArrowRight"){ e.preventDefault(); go(state.idx+1); }
  if(e.altKey && e.key === "ArrowLeft"){ e.preventDefault(); go(state.idx-1); }
});

load();
render();
</script>
</body>
</html>
